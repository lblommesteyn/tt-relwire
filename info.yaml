# Tiny Tapeout project information
project:
  title:        "RelWire protocol emulator"
  author:       "Luke Blommesteyn"
  discord:      ""
  description:  "Four protocol cores running one relational program: controller, target and sniffer from the same binary"
  language:     "Verilog"
  clock_hz:     50000000
  tiles: "6x4"
  top_module:  "tt_um_relwire"
  source_files:
    - "tt_um_relwire.v"
    - "rpm_core.v"

pinout:
  ui[0]: "load data[0]"
  ui[1]: "load data[1]"
  ui[2]: "load data[2]"
  ui[3]: "load data[3]"
  ui[4]: "load data[4]"
  ui[5]: "load data[5]"
  ui[6]: "load data[6]"
  ui[7]: "load data[7]"
  uo[0]: "status: 0 / readback[0]"
  uo[1]: "status: last event core[0] / readback[1]"
  uo[2]: "status: last event core[1] / readback[2]"
  uo[3]: "status: last event code[0] / readback[3]"
  uo[4]: "status: last event code[1] / readback[4]"
  uo[5]: "status: last event code[2] / readback[5]"
  uo[6]: "status: all cores halted / readback[6]"
  uo[7]: "status: running / readback[7]"
  uio[0]: "protocol wire 0"
  uio[1]: "protocol wire 1"
  uio[2]: "protocol wire 2"
  uio[3]: "protocol wire 3"
  uio[4]: ""
  uio[5]: ""
  uio[6]: "load frame reset (input)"
  uio[7]: "load byte strobe (input)"

yaml_version: 6
